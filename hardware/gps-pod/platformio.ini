; GPS 포드 펌웨어 (Seeed XIAO ESP32-S3 + u-blox GNSS 모듈)
;   MAX-M10S / SAM-M10Q 같은 M10 모듈  -> env:xiao_m10
;   Beitian BN-220 / BN-880 같은 M8 모듈 -> env:xiao_m8
[env]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"0.1.0\"
    -DDEVICE_ID=\"POD-01\"

[env:xiao_m10]
build_flags =
    ${env.build_flags}
    -DGNSS_M10=1

[env:xiao_m8]
build_flags =
    ${env.build_flags}
    -DGNSS_LEGACY_M8=1
